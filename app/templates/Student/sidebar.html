<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">


    <!-- ================= LOGO ================= -->

    <div class="logo">

        <div class="logo-icon">

            <i class="bi bi-mortarboard-fill"></i>

        </div>


        <div>

            <h2>StudentIQ</h2>

            <span>Predictive Analytics</span>

        </div>

    </div>



    <!-- ================= MENU ================= -->

    <ul class="menu">


        <!-- Dashboard -->

        <li
            class="{% if request.path == '/' or request.path == '/dashboard' %}active{% endif %}"
            onclick="window.location.href='/dashboard'"
        >

            <i class="bi bi-grid-fill"></i>

            <span>Dashboard</span>

        </li>



        <!-- Attendance -->

        <li
            class="{% if request.path == '/attendance' %}active{% endif %}"
            onclick="window.location.href='/attendance'"
        >

            <i class="bi bi-calendar-check-fill"></i>

            <span>Attendance</span>

        </li>



        <!-- Analytics -->

        <li
            class="{% if request.path == '/analytics' %}active{% endif %}"
            onclick="window.location.href='/analytics'"
        >

            <i class="bi bi-bar-chart-fill"></i>

            <span>Analytics</span>

        </li>



        <!-- Reports -->

        <li
            class="{% if request.path == '/reports' %}active{% endif %}"
            onclick="window.location.href='/reports'"
        >

            <i class="bi bi-file-earmark-text-fill"></i>

            <span>Reports</span>

        </li>



        <!-- Settings -->

        <li
            class="{% if request.path == '/settings' %}active{% endif %}"
            onclick="window.location.href='/settings'"
        >

            <i class="bi bi-gear-fill"></i>

            <span>Settings</span>

        </li>

        <!-- Logout -->

        <li
            onclick="window.location.href='/logout'"
            style="cursor: pointer; color: #ffffff;"
        >

            <i class="bi bi-box-arrow-right" style="color: #ffffff;"></i>

            <span style="color: #ffffff;">Logout</span>

        </li>


    </ul>



    <!-- ================= SMART ANALYTICS ================= -->

    <div class="sidebar-illustration">

        <img
            src="{{ url_for('static', filename='images/student-ai.png') }}"
            alt="AI Student Analytics"
        >

        <h4>Smart Analytics</h4>

    </div>


</aside>
